name: CD
on:
  workflow_dispatch:

  repository_dispatch:
    types: [ deploy ]

  # main push 가 아니라 PR 머지로 실행한다.
  # squash 머지 커밋 본문에 하위 커밋 메시지가 붙는데, 그중 대괄호로 감싼 skip ci 문구(#64 커밋 설명)가 있으면
  # GitHub 이 push 워크플로우 런을 아예 만들지 않는다(v4.0.4·v4.1.0 CD 미실행).
  # PR 이벤트는 PR HEAD 커밋 메시지만 보므로 squash 본문의 영향을 받지 않는다.
  # pull_request_target: fork PR 이 머지돼도 저장소 secret·쓰기 권한으로 실행된다.
  # PR 코드는 checkout 하지 않고 항상 main 을 받으므로 안전하다.
  pull_request_target:
    types: [ closed ]
    branches:
      - 'main'

jobs:
  deploy:
    # 머지 없이 닫힌 PR 은 배포하지 않는다.
    # (문서 봇의 'docs:' 커밋은 main 에 직접 push 되므로 이 워크플로우를 실행하지 않는다)
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    # job 수준에 둬서 머지 없이 닫힌 PR(job skip)이 대기 중인 배포를 밀어내지 않게 한다.
    # 실행 중·대기 중 배포는 취소하지 않는다(queue: max — 기본 single 은 앞선 대기 실행을 취소한다).
    concurrency:
      group: cd-main
      cancel-in-progress: false
      queue: max
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      # 공개 저장소라 토큰 없이 받는다. self-hosted 러너는 작업 폴더를 문서 워크플로와 함께 쓰므로
      # 토큰을 remote URL 에 남기지 않는다(예전 런이 남긴 토큰도 여기서 지운다). 태그 push 는 그 단계에서 토큰을 명시한다.
      - name: Checkout code
        run: |
          if [ -d .git ]; then
            git remote set-url origin https://github.com/wanteddev/montage-android.git
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fdx
          else
            git clone --branch main https://github.com/wanteddev/montage-android.git .
          fi
          git fetch --unshallow || true

      - name: Set VersionInfo from publish.properties
        run: |
          grep "version=" library/publish.properties | \
          cut -d '=' -f2 | tr -d ' ' | \
          xargs -I {} echo "VERSION_CODE={}" >> $GITHUB_ENV

      - name: Print Version
        run: |
          echo ${{env.VERSION_CODE}}

      # 버전을 올리지 않은 PR(ci·문서·figma/ sync 등)도 main 에 머지되면 이 워크플로가 돈다.
      # 이미 GitHub Packages 에 있는 버전을 다시 올리면 409 Conflict 로 실패하므로, 있으면 build·publish 를 건너뛰고
      # 태그·Release 단계는 그대로 돌린다(둘 다 이미 있으면 건너뛰므로 멱등하다 — 앞선 런이 publish 뒤에 실패했어도 재실행으로 복구된다).
      # 조회가 실패하면 건너뛰지 않는다(예전처럼 publish 를 시도하고, 이미 있으면 409 로 실패해 드러난다).
      - name: Check published version
        id: published
        env:
          GH_TOKEN: ${{ secrets.WANTED_DEV_TOKEN }}
        run: |
          GROUP=$(grep '^groupId=' library/publish.properties | cut -d '=' -f2 | tr -d ' ')
          ARTIFACT=$(grep '^artifactId=' library/publish.properties | cut -d '=' -f2 | tr -d ' ')
          if ! VERSIONS=$(gh api --paginate "orgs/wanteddev/packages/maven/${GROUP}.${ARTIFACT}/versions" -q '.[].name'); then
            echo "::warning::GitHub Packages 버전 조회에 실패해 publish 를 그대로 시도합니다."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$VERSIONS" | grep -qxF "${{ env.VERSION_CODE }}"; then
            echo "::notice::${GROUP}:${ARTIFACT}:${{ env.VERSION_CODE }} 은 이미 게시돼 있어 build·publish 를 건너뜁니다(태그·Release 는 확인)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: build
        if: steps.published.outputs.exists != 'true'
        run: |
          ./gradlew :library:assembleRelease

      - name: publish
        if: steps.published.outputs.exists != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WANTED_DEV_TOKEN }}
        run: |
          ./gradlew :library:publishReleasePublicationToGithubPackagesRepository --stacktrace

      - name: Create & Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.WANTED_DEV_TOKEN }}
          ALREADY_PUBLISHED: ${{ steps.published.outputs.exists }}
        run: |
          git config --local user.name "deploy-bot"
          git config --local user.email "deploy-bot@github.com"
          TAG="v${{env.VERSION_CODE}}"

          # 원격에 태그가 이미 있으면 아무것도 하지 않는다(대상 커밋을 찾을 필요도 없다).
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "⚠️ Tag ${TAG} already exists on remote, skipping"
            exit 0
          fi

          # 태그 대상: 이번 런이 publish 했으면 지금 빌드한 HEAD.
          # 이미 게시된 버전인데 태그가 없으면(앞선 런이 publish 뒤에 실패) HEAD 가 아니라 main 에 그 버전이 들어온 커밋에 단다 —
          # 그사이 다른 머지가 들어왔어도 JitPack(태그로 빌드)과 GitHub Packages 의 내용이 어긋나지 않게 한다.
          # --first-parent + --diff-merges=first-parent: main 의 커밋(squash 커밋 또는 release 머지 커밋)을 고른다.
          #   release 브랜치 안의 범프 커밋을 고르면 그 뒤 수정이 빠지고, 머지 충돌 해결로만 들어온 버전 줄은 머지 커밋에서만 보인다.
          # -G 로 'version=<버전>' 줄 전체가 바뀐 커밋만 본다(주석 등에 같은 글자가 있어도 걸리지 않음).
          TARGET=HEAD
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            VERSION_RE=$(printf '%s' "${{env.VERSION_CODE}}" | sed 's/[.]/\\./g')
            TARGET=$(git log -1 -s --format=%H --first-parent --diff-merges=first-parent \
              -G"^version=${VERSION_RE}[[:space:]]*$" HEAD -- library/publish.properties)
            if [ -z "$TARGET" ]; then
              echo "::error::main 에서 version=${{env.VERSION_CODE}} 이 들어온 커밋을 찾지 못해 태그를 달지 않습니다. 태그를 손으로 확인하세요."
              exit 1
            fi
            echo "이미 게시된 버전이라 태그 대상을 그 버전이 들어온 커밋 ${TARGET} 로 잡습니다."
          fi

          # 로컬에 남은 같은 이름 태그(재사용 작업 폴더)는 지우고 대상에 다시 단다.
          git tag -d "${TAG}" >/dev/null 2>&1 || true
          echo "✅ Creating tag ${TAG} at ${TARGET}"
          git tag "${TAG}" "$TARGET"
          echo "🚀 Pushing tag ${TAG}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/wanteddev/montage-android.git "${TAG}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.WANTED_DEV_TOKEN }}
        run: |
          TAG_NAME="v${{env.VERSION_CODE}}"
          
          # 릴리즈가 이미 존재하는지 확인
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG_NAME already exists. Skipping release creation."
          else
            echo "✅ Creating GitHub release: $TAG_NAME"
          
            # Release notes 생성
            cat > release_notes.md << EOF
          🚀 Design System Release ${{env.VERSION_CODE}}
          
          ## Changes
          - Available on JitPack (built from tag v${{env.VERSION_CODE}})
          - GroupId: com.github.wanteddev
          - ArtifactId: montage-android
          - Version: v${{env.VERSION_CODE}}

          ## Installation
          \`settings.gradle.kts\`
          \`\`\`kotlin
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          \`\`\`

          \`build.gradle.kts\`
          \`\`\`kotlin
          dependencies {
              implementation("com.github.wanteddev:montage-android:v${{env.VERSION_CODE}}")
          }
          \`\`\`
          EOF
          
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release_notes.md \
              --target main
          
            echo "🎉 Release $TAG_NAME created successfully"
          fi
