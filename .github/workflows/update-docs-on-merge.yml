name: Update Design System Docs on Merge

# 이 워크플로우의 트리거 조건
on:
  push:
    branches:
      - main        # release/v{버전} 브랜치에 push(merge)될 때 실행
  workflow_dispatch:
    inputs:
      branch:
        description: "워크플로우를 실행할 브랜치"
        required: true
        default: "main"

jobs:
  # 기존 CI 파일에 있던 디자인 시스템 문서 업데이트 Job을 그대로 가져옵니다.
  update_ds_docs:
    name: Update and Commit Design System Docs
    runs-on: self-hosted
    timeout-minutes: 30

    # 중요: 무한 루프 방지
    # 봇이 커밋한 메시지가 'docs:'로 시작하면 이 Job을 실행하지 않습니다.
    # (contains 는 squash 머지 본문의 'docs:' 커밋까지 걸려 릴리스 문서 생성을 건너뛰므로 startsWith 로 제목만 봅니다)
    if: "startsWith(github.event.head_commit.message, 'docs:') == false"

    steps:
      - name: Checkout code
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || 'main' }}"
          if [ -d .git ]; then
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          else
            git clone --branch "$TARGET_BRANCH" https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wanteddev/montage-android.git .
          fi

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Install Kotlin
        run: |
          if ! command -v kotlin &> /dev/null; then
            echo " Kotlin이 설치되어 있지 않습니다. Homebrew로 설치를 시작합니다..."
            brew install kotlin
            echo " Kotlin 설치 완료"
          else
            echo " Kotlin이 이미 설치되어 있습니다."
            kotlin -version
          fi

      - name: Clean and Build Project
        run: |
          echo "🧹 프로젝트 클린 중..."
          ./gradlew clean
          echo "🔨 프로젝트 빌드 중..."
          # lint 태스크 제외: 문서 추출용 컴파일만 필요하며,
          # :sample:lintAnalyzeDebug 가 AGP local_aar_for_lint transform 버그로 실패하는 것을 회피
          ./gradlew build -x test -x lint -x lintAnalyzeDebug -x lintAnalyzeRelease

      - name: Update Design System Document
        run: |
          ./gradlew \
            :library:extractDesignSystemJavadocToMd \
            :library:mergeDesignSystemJavadocByPackage
          sleep 1

      # source 변경 여부와 무관하게 항상 mdx 를 다시 만든다.
      # extractDesignSystemJavadocToMd 가 document/md 를 통째로 지우고 시작하므로,
      # 여기서 스킵하면 md 가 삭제된 채로 남아 아래 Validate docs 가 대상 파일을 찾지 못하고 실패한다.
      - name: Update DS Document mdx
        run: |
          echo "🔄 DS 문서 mdx 를 재생성합니다 (runKdocScriptAll)..."
          ./gradlew :library:runKdocScriptAll

      # 문서 사이트(montage-web) 빌드와 같은 방식으로 mdx 를 컴파일해 본다. 실패하면 docs 커밋을 만들지 않고 job 이 실패해
      # auto-deploy-docs 도 실행되지 않는다. 고칠 곳은 생성물(mdx)이 아니라 원본 KDoc 이다.
      - name: Validate docs
        uses: wanteddev/montage-web/.github/actions/validate-docs@main
        with:
          files: library/document/md/*.{md,mdx}
          mobile-source: true

      - name: Commit & Push Design System Docs
        run: |
          git config --local user.name "deploy-bot"
          git config --local user.email "deploy-bot@github.com"

          # 변경된 파일만 스테이징 (존재하는 경우에만)
          # -f: library/.gitignore 에 /document 가 들어가도 새 컴포넌트 문서(신규 파일)가 빠지지 않게 강제로 추가합니다.
          [ -d "library/document/source" ] && git add -f library/document/source || echo "⚠️ library/document/source not found, skipping"
          [ -d "library/document/md" ] && git add -f library/document/md || echo "⚠️ library/document/md not found, skipping"
          [ -f "library/publish.properties" ] && git add library/publish.properties || echo "⚠️ library/publish.properties not found, skipping"

          # 변경사항이 있는지 확인
          if git diff --cached --quiet; then
            echo "✅ No doc changes to commit"
            exit 0
          fi

          echo "📝 Committing changes..."
          # [skip ci]: 이 push 로는 워크플로우 런 자체가 만들어지지 않는다.
          # 아래 if 조건들(docs: 로 시작하면 job skip)은 런이 생긴 뒤 job 만 건너뛰므로,
          # 완료 이벤트가 발화해 auto-deploy-docs 가 빈 런으로 한 번 더 돌고 Actions 목록도 지저분해진다.
          git commit -m "docs: update Design System documentation and mdx [skip ci]"
          
          echo "🚀 Pushing changes..."
          git push