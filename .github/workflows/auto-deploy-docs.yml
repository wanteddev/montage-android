name: Auto Docs Sync/Deploy on Release

# 릴리스 생성 시점에는 문서 재생성 커밋이 아직 main 에 없을 수 있으므로,
# 문서 워크플로우가 main 에 문서를 push 한 뒤에 montage-web 동기화를 실행합니다.
on:
  workflow_run:
    workflows: [ "Update Design System Docs on Merge" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # actions/checkout 은 엔터프라이즈 정책으로 막혀 있어 git clone 으로 받는다.
      # 트리거 커밋(head_sha)이 아니라 main 최신을 받는다 — update-docs 가 그 뒤에 docs: 커밋을 push 하기 때문이다.
      # 공개 저장소라 토큰 없이 받는다(로컬 act 에서 토큰이 비면 인증 프롬프트로 실패한다).
      # 작업 폴더가 비어 있지 않은 환경(act 는 로컬 저장소를 복사해 둔다)에서도 돌도록 별도 폴더로 받는다.
      - name: Checkout code
        run: |
          rm -rf montage-main
          git clone --depth 1 --branch main https://github.com/${{ github.repository }}.git montage-main

      - name: Validate docs
        uses: wanteddev/montage-web/.github/actions/validate-docs@main
        with:
          files: montage-main/library/document/md/*.{md,mdx}
          mobile-source: true

      - name: Generate GitHub App Token
        id: app-token
        env:
          APP_ID: ${{ secrets.BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          TARGET_REPO: wanteddev/montage-web
        run: |
          set -euo pipefail

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          # 1) JWT 생성 (RS256)
          now=$(date +%s)
          iat=$((now - 60))
          exp=$((now + 540))
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)
          unsigned="${header}.${payload}"

          key_file="$(mktemp)"
          printf '%s\n' "$PRIVATE_KEY" > "$key_file"
          signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" | b64url)
          jwt="${unsigned}.${signature}"
          rm -f "$key_file"

          # 2) 대상 저장소의 App 설치 ID 조회
          installation_id=$(curl -sf \
            -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TARGET_REPO}/installation" \
            | jq -r '.id')

          # 3) 설치 액세스 토큰 발급 (montage-web 저장소로 스코프 제한)
          token=$(curl -sf -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" \
            -d '{"repositories":["montage-web"]}' \
            | jq -r '.token')

          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Trigger docs-deploy on sync branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run docs-sync.yml \
            --repo wanteddev/montage-web \
            --ref "main" \
            -f platform=android \
            -f deploy=true
